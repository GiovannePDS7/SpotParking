<body>
    <div id="containerSeta">

    <div id="containerDash">

        <main id="containerMain">


            <div id="containerLeft">

                    </div>

                </div>
                <div class="containerGrafico">
                    <div class="containerCanvas">

            <div id="containerRight">

                    <div class="KPI">

                            <span class="KPIdiaSemana" id="KPI3diaSemana"></span>
                        </div>
                    </div>
                    <div class="KPI">
                        <span class="titleKPI" id="kpi4"></span>

                        <div class="containerKPIDados">

                        </div>

                </div>

                    <select id="SelectPosicao" class="selects"></select>
                </div>

            </div>

    </div>
    <script>
        var idUsuario = sessionStorage.ID_USUARIO;
        const SelectSemana = document.getElementById('SelectSemana');
        const SelectMes = document.getElementById('SelectMes');

        var SelectPiso = document.getElementById('SelectPiso');
        var SelectPosicao = document.getElementById('SelectPosicao');

        const hoje = new Date();
        let optionsHTML = '';
        let dataOpt = '';
        var texto = ''
        const data = new Date();

        for (let i = 0; i < 12; i++) {
            let ano = data.getFullYear();
            let mes = data.getMonth() - i + 1;

            if (mes <= 0) {
                mes += 12;
                ano -= 1;
            }
            if (String(mes).length == 1) {
                mes = `0${mes}`
            }
            dataOpt = `${ano}-${mes}-`

            switch (String(mes)) {
                case '01':
                    texto = `Janeiro de ${ano}`
                    break;

                case '02':
                    texto = `Fevereiro de ${ano}`
                    break;

                case '03':
                    texto = `Março de ${ano}`
                    break;

                case '04':
                    texto = `Abril de ${ano}`
                    break;

                case '05':
                    texto = `Maio de ${ano}`
                    break;

                case '06':
                    texto = `Junho de ${ano}`
                    break;

                case '07':
                    texto = `Julho de ${ano}`
                    break;

                case '08':
                    texto = `Agosto de ${ano}`
                    break;

                case '09':
                    texto = `Setembro de ${ano}`
                    break;

                case '10':
                    texto = `Outubro de ${ano}`
                    break;

                case '11':
                    texto = `Novembro de ${ano}`
                    break;

                case '12':
                    texto = `Dezembro de ${ano}`
                    break;
            }
            optionsHTML += `<option class="optSelect" value="${dataOpt}">${texto}</option>`;
        }

        SelectMes.innerHTML = optionsHTML;


        var kpi3 = document.getElementById('kpi3')
        var kpi4 = document.getElementById('kpi4')

        function CarregarTextoKPI_3_4() {
            const textoMes = SelectMes.selectedOptions[0].text;
            const textoSemana = SelectSemana.selectedOptions[0].text;

            kpi3.innerHTML = `Maior fluxo de veiculos no mês de ${textoMes} na ${textoSemana[0].toLowerCase() + textoSemana.slice(1)}`;
            kpi4.innerHTML = `Menor fluxo de veiculos no mês de ${textoMes} na ${textoSemana[0].toLowerCase() + textoSemana.slice(1)}`;
        }

        function CarregarTextoKPI_1_2() {
            const textoMes = SelectMes.selectedOptions[0].text;
            const textoSemana = SelectSemana.selectedOptions[0].text;

            kpi3.innerHTML = `Maior fluxo de veiculos no mês de ${textoMes} na ${textoSemana[0].toLowerCase() + textoSemana.slice(1)}`;
            kpi4.innerHTML = `Menor fluxo de veiculos no mês de ${textoMes} na ${textoSemana[0].toLowerCase() + textoSemana.slice(1)}`;
        }

        addEventListener("DOMContentLoaded", function () {
            CarregarTextoKPI_3_4();
            ObterDadosKPI3();
            ObterDadosKPI4();
            ObterDadosKPI1();
            ObterDadosKPI2();
            obterDadosGrafico1();
            ObterPiso();
            ObterPosicao();

        });

        SelectSemana.addEventListener('change', ObterDadosKPI3)
        SelectMes.addEventListener('change', ObterDadosKPI3)
        SelectSemana.addEventListener('change', ObterDadosKPI4)
        SelectMes.addEventListener('change', ObterDadosKPI4)
        SelectSemana.addEventListener('change', ObterDadosKPI1)
        SelectMes.addEventListener('change', ObterDadosKPI1)
        SelectSemana.addEventListener('change', ObterDadosKPI2)
        SelectMes.addEventListener('change', ObterDadosKPI2)

        SelectPiso.addEventListener('change', obterDadosGrafico2)
        SelectPosicao.addEventListener('change', obterDadosGrafico2)

        function ObterDadosKPI3() {
            var SelectSemana = document.getElementById('SelectSemana');
            var SelectMes = document.getElementById('SelectMes');

            fetch("/dashboard/ObterDadosKPI3", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    selectSemanaServer: SelectSemana.value,
                    selectPeriodoServer: SelectMes.value,
                    idUsuario: idUsuario
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        var kpi3Value = document.getElementById('kpi3Value')
                        var KPI3diaSemana = document.getElementById('KPI3diaSemana')

                        resposta.json().then(json => {
                            kpi3Value.innerHTML = json.totalEntradas;
                            KPI3diaSemana.innerHTML = json.diaSemana
                        })
                        CarregarTextoKPI_3_4()

                    }
                    else {
                        const textoSemana = SelectSemana.options[0].text;
                        kpi4.innerHTML = `Maior fluxo de veículos no mês de ${SelectMes.options[0].text} na ${textoSemana.toLowerCase()}`;
                    }

                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }
        function ObterDadosKPI4() {
            var SelectSemana = document.getElementById('SelectSemana');
            var SelectMes = document.getElementById('SelectMes');

            fetch("/dashboard/ObterDadosKPI4", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    selectSemanaServer: SelectSemana.value,
                    selectPeriodoServer: SelectMes.value,
                    idUsuario: idUsuario
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        var kpi4Value = document.getElementById('kpi4Value')
                        var KPI4diaSemana = document.getElementById('KPI4diaSemana')
                        resposta.json().then(json => {
                            kpi4Value.innerHTML = json.totalEntradas;
                            KPI4diaSemana.innerHTML = json.diaSemana

                        })
                        CarregarTextoKPI_3_4()
                    }
                    else {
                        const textoSemana = SelectSemana.options[0].text;
                        kpi4.innerHTML = `Menor fluxo de veículos no mês de ${SelectMes.options[0].text} na ${textoSemana.toLowerCase()}`;
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }

        var aux_aviso = false
        function ObterDadosKPI1() {
            var SelectSemana = document.getElementById('SelectSemana');
            var SelectMes = document.getElementById('SelectMes');

            fetch("/dashboard/ObterDadosKPI1", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    selectSemanaServer: SelectSemana.value,
                    selectPeriodoServer: SelectMes.value,
                    idUsuario: idUsuario
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {

                        var kpi1Value = document.getElementById('kpi1Value')
                        var KPI1diaSemana = document.getElementById('KPI1diaSemana')
                        resposta.json().then(json => {
                            console.table(json)
                            kpi1Value.innerHTML = `${json.horario}`
                            if (json.totalOcupacao == 1) {
                                KPI1diaSemana.innerHTML = `${json.diaSemana}: <b>${json.totalOcupacao}</b> ocupação`
                            } else {
                                KPI1diaSemana.innerHTML = `${json.diaSemana}: <b>${json.totalOcupacao}</b> ocupações`
                            }
                        })
                    } else {
                        if (resposta == undefined && SelectSemana.value == '1' && SelectMes.selectedIndex == 0 && aux_aviso == false) {
                            alert('Nenhum dado da semana atual encontrado');
                            aux_aviso = true
                        } else {
                            alert('Nenhum dado encontrado');
                        }
                        SelectSemana.value = "1";
                        SelectMes.selectedIndex = 0;
                        ObterDadosKPI1()
                        ObterDadosKPI2()
                        ObterDadosKPI3()
                        ObterDadosKPI4()

                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }
        function ObterDadosKPI2() {
            var SelectSemana = document.getElementById('SelectSemana');
            var SelectMes = document.getElementById('SelectMes');

            fetch("/dashboard/ObterDadosKPI2", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    selectSemanaServer: SelectSemana.value,
                    selectPeriodoServer: SelectMes.value,
                    idUsuario: idUsuario
                }),
            })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {

                        var kpi2Value = document.getElementById('kpi2Value')
                        var KPI2diaSemana = document.getElementById('KPI2diaSemana')
                        resposta.json().then(json => {
                            console.table(json)
                            kpi2Value.innerHTML = `${json.horario}`
                            if (json.totalOcupacao == 1) {
                                KPI2diaSemana.innerHTML = `${json.diaSemana}: <b>${json.totalOcupacao}</b> ocupação`
                            } else {
                                KPI2diaSemana.innerHTML = `${json.diaSemana}: <b>${json.totalOcupacao}</b> ocupações`
                            }

                        })
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }


        // Gráficos

        let proximaAtualizacaoG1;

        function obterDadosGrafico1() {

            if (proximaAtualizacaoG1 != undefined) {
                clearTimeout(proximaAtualizacaoG1);
            }

            fetch(
                `/dashboard/pegarUltimosDadosG1/${idUsuario}`,
                { cache: "no-store" }
            )
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {
                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                            resposta.reverse();

                            plotarGrafico1(resposta, idUsuario);
                        });
                    }
                })
                .catch(function (error) {
                    console.error(
                        `Erro na obtenção dos dados p/ gráfico: ${error.message}`
                    );
                });
        }


        function plotarGrafico1(resposta, idUsuario) {
            console.log("iniciando plotagem do gráfico...");

            // Criando estrutura para plotar gráfico - labels
            let labels = [];

            // Criando estrutura para plotar gráfico - dados
            let dados = {
                labels: labels,
                datasets: [{
                    label: 'Ocupação do estacionamento',
                    data: [],
                    borderColor: '#d17711',
                    backgroundColor: 'transparent',
                }]
            };

            console.log("----------------------------------------------");
            console.log(
                'Estes dados foram recebidos pela funcao "obterDadosGrafico1" e passados para "plotarGrafico1":'
            );
            console.log(resposta);
            // Inserindo valores recebidos em estrutura para plotar o gráfico
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                labels.push(registro.hora);
                dados.datasets[0].data.push(registro.ocupacao);
            }

            console.log("----------------------------------------------");
            console.log("O gráfico será plotado com os respectivos valores:");
            console.log("Labels:");
            console.log(labels);
            console.log("Dados:");
            console.log(dados.datasets);
            console.log("----------------------------------------------");

            // Criando estrutura para plotar gráfico - config
            const config = {
                type: "line",
                data: dados,
                options: {
                    scales: {
                        x: {
                            ticks: {
                                color: "#fff",
                            },
                        },
                        y: {
                            ticks: {
                                color: "#fff",
                            },
                        },
                    },
                },
            };

            // Adicionando gráfico criado em div na tela
            let myChart = new Chart(document.getElementById(`Ocupacao_PHorario`), config);
            setTimeout(
                () => atualizarGrafico1(idUsuario, dados, myChart),
                2000
            );
        }


        function atualizarGrafico1(idUsuario, dados, myChart) {
            fetch(
                `/dashboard/tempo-realG1/${idUsuario}`,
                { cache: "no-store" }
            )
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (novoRegistro) {
                            console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                            console.log(`Dados atuais do gráfico:`);
                            console.log(dados);
                            console.log(`DADO ATUAL: ${dados.datasets[0].data[dados.datasets[0].data.length - 1]}`);
                            console.log(`DADO RECEBIDO: ${novoRegistro[0].ocupacao}`);

                            var novaOcupacao = novoRegistro[0].ocupacao
                            var novaHora = novoRegistro[0].hora
                            var ultimaOcupacao = dados.datasets[0].data[dados.datasets[0].data.length - 1]
                            var ultimaHora = dados.labels[dados.labels.length - 1]

                            if (novaOcupacao != ultimaOcupacao || novaHora != ultimaHora) {

                                if (novaOcupacao != ultimaOcupacao && novaHora == ultimaHora) {
                                    dados.datasets[0].data[dados.datasets[0].data.length - 1] = novaOcupacao;
                                } else if (novaHora != ultimaHora) {
                                    if (dados.labels.length >= 6) {
                                        dados.labels.shift();
                                        dados.datasets[0].data.shift();
                                    }
                                    dados.datasets[0].data.push(novaOcupacao)
                                    dados.labels.push(novaHora)
                                }


                                myChart.update();
                            }


                            else {
                                console.log(
                                    "--------"
                                );
                                console.log(
                                    "Como não há dados novos para captura, o gráfico não atualizará."
                                );

                                console.log("Ocupação do novo dado capturado:");
                                console.log(novoRegistro[0].ocupacao);
                                console.log("Ocupação do último dado capturado:");
                                console.log(dados.datasets[0].data[dados.datasets[0].data.length - 1]);
                                console.log(
                                    "--------"
                                );
                            }
                            // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                            proximaAtualizacaoG1 = setTimeout(
                                () =>
                                    atualizarGrafico1(
                                        idUsuario,
                                        dados,
                                        myChart
                                    ),
                                2000
                            );
                        });
                    } else {
                        console.error("Nenhum dado encontrado ou erro na API");
                        // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                        proximaAtualizacaoG1 = setTimeout(
                            () =>
                                atualizarGrafico1(
                                    idUsuario,
                                    dados,
                                    myChart
                                ),
                            2000
                        );
                    }
                })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }

        function ObterPiso() {

            fetch(`/dashboard/ObterPiso/${idUsuario}`, { cache: "no-store" })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);
                    if (resposta.ok) {
                        resposta.json().then(json => {
                            for (let i = 0; i < json.length; i++) {
                                SelectPiso.innerHTML += `<option class="optSelect" value="${json[i].piso}">${json[i].piso}</option>`
                            }
                        })
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }

        function ObterPosicao() {
            var SelectPosicao = document.getElementById('SelectPosicao');

            fetch(`/dashboard/ObterPosicao/${idUsuario}`, { cache: "no-store" })
                .then(function (resposta) {
                    console.log("resposta: ", resposta);
                    if (resposta.ok) {
                        resposta.json().then(json => {
                            for (let i = 0; i < json.length; i++) {
                                SelectPosicao.innerHTML += `<option class="optSelect" value="${json[i].posicao}">${json[i].posicao}</option>`
                            }
                            obterDadosGrafico2();

                        })
                    }
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });

        }


        let proximaAtualizacaoG2;

        function obterDadosGrafico2() {
            var SelectPiso = document.getElementById('SelectPiso')
            var SelectPosicao = document.getElementById('SelectPosicao')

            var piso = SelectPiso.value;
            var posicao = SelectPosicao.value;

            var spanSensorEspecifico = document.getElementById('spanSensorEspecifico');
            spanSensorEspecifico.innerHTML = `Dados do sensor da vaga ${posicao} no piso ${piso}`

            if (proximaAtualizacaoG2 != undefined) {
                clearTimeout(proximaAtualizacaoG2);
            }

            fetch(
                `/dashboard/pegarUltimosDadosG2/${idUsuario}/${piso}/${posicao}`,
                { cache: "no-store" }
            )
                .then(function (response) {
                    if (response.ok) {
                        response.json().then(function (resposta) {
                            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                            resposta.reverse();

                            plotarGrafico2(resposta, idUsuario, piso, posicao);
                        });
                    }
                })
                .catch(function (error) {
                    console.error(
                        `Erro na obtenção dos dados p/ gráfico: ${error.message}`
                    );
                });
        }

        let myChart2;

        function plotarGrafico2(resposta, idUsuario, piso, posicao) {
            console.log("iniciando plotagem do gráfico...");

            if (myChart2) {
                myChart2.destroy();
            }

            // Criando estrutura para plotar gráfico - labels
            let labels = [];

            // Criando estrutura para plotar gráfico - dados
            let dados = {
                labels: labels,
                datasets: [{
                    label: 'Ocupação do estacionamento',
                    data: [],
                    borderColor: '#d17711',
                    backgroundColor: 'transparent',
                }]
            };

            console.log("----------------------------------------------");
            console.log(
                'Estes dados foram recebidos pela funcao "obterDadosGrafico2" e passados para "plotarGrafico2":'
            );
            console.log(resposta);
            // Inserindo valores recebidos em estrutura para plotar o gráfico
            for (i = 0; i < resposta.length; i++) {
                var registro = resposta[i];
                labels.push(registro.hora);
                dados.datasets[0].data.push(registro.ocupacao);
            }

            console.log("----------------------------------------------");
            console.log("O gráfico será plotado com os respectivos valores:");
            console.log("Labels:");
            console.log(labels);
            console.log("Dados:");
            console.log(dados.datasets);
            console.log("----------------------------------------------");

            // Criando estrutura para plotar gráfico - config
            const config = {
                type: "line",
                data: dados,
                options: {
                    scales: {
                        x: {
                            ticks: {
                                color: "#fff",
                            },
                        },
                        y: {
                            ticks: {
                                color: "#fff",
                            },
                        },
                    },
                },
            };

            myChart2 = new Chart(document.getElementById(`SensorEspecifico`), config);
            setTimeout(
                () => atualizarGrafico2(idUsuario, piso, posicao, dados, myChart2),
                2000
            );
        }


        function atualizarGrafico2(idUsuario, piso, posicao, dados, myChart) {
            fetch(
                `/dashboard/tempo-realG2/${idUsuario}/${piso}/${posicao}`,
                { cache: "no-store" }
            )
                .then(function (response) {

                    if (response.ok) {
                        response.json().then(function (novoRegistro) {
                            console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
